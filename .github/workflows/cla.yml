# Asks every pull request author to sign CLA.md by comment. Signatures are committed to the
# `cla-signatures` branch, never to main. This workflow never checks out pull request code,
# which keeps pull_request_target safe.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write # store signatures
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: >-
      (github.event_name == 'pull_request_target') ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-latest
    steps:
      # v2.6.1, pinned by commit for supply-chain safety.
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/pearcoderhq/pearcoder/blob/main/CLA.md
          branch: cla-signatures
          allowlist: halilturkoglucs,dependabot[bot],github-actions[bot]
